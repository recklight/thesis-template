name: 功能建議
description: 想要的新功能，或希望某個行為改一下
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 現在卡在哪裡，為什麼會造成困擾。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建議做法
      description: 你希望它怎麼運作？如果是新的指令或選項，寫出你想怎麼下指令。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他考慮過的做法
